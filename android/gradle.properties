org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.nonTransitiveRClass=true
# Built-in Kotlin и новый DSL выключены, как в шаблоне Flutter 3.50: плагины
# (file_picker, package_info_plus, patrol, ...) сами применяют kotlin-android,
# а он несовместим с newDsl и builtInKotlin под AGP 9. Включить, когда плагины мигрируют.
android.builtInKotlin=false
android.newDsl=false
