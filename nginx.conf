server {
    listen 80;
    server_name _ default_server;
    root /usr/share/nginx/html;

    # App Links / Universal Links verification files. Served as JSON and never
    # replaced by the SPA shell: a missing file must be a 404, not index.html.
    # See doc/deeplink/README.md.
    location ^~ /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
