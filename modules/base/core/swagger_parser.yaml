# swagger_parser 2.x config — API client generation for the core module's api layer.
# Isolated codegen: `melos run genapi` runs this from the module dir, OUTSIDE
# the app's global build_runner pass. Output lives only under api/adapters/swagger_parser/generated.
#
# schema_path points at the PREPROCESSED spec, not the raw doc/api/openapi.json.
# `melos genapi` first runs `dart run tool/preprocess_openapi.dart`, which
# normalises the spec for the generator (non-JSON request-body variants, path
# parameters without a placeholder, schema names with spaces, over-stated
# non-null fields — see tool/preprocess_openapi.dart).
swagger_parser:
  schema_path: .gen/openapi.preprocessed.json
  output_directory: lib/api/adapters/swagger_parser/generated/
  generation:
    # Root facade `AcitsGeneratedClient` (file acits_generated_client.dart).
    root_api_class_name: AcitsGeneratedClient
    http_client: retrofit
    serializer: json_serializable
    # Unknown enum values from the backend map to a fallback member instead of throwing.
    unknown_enum_values: preserve
    original_http_response: false
    # 1.x emitted schema defaults as Dart defaults (`int? xCurrentShelter = 2` on
    # 102 operations). Keep that wire behaviour: a call that omits the argument
    # still sends the spec default.
    apply_parameter_defaults: true
    # 2.x maps `format: date` to String; 1.x (and our DTOs) use DateTime. The
    # codec reproduces json_serializable's 1.x DateTime handling exactly.
    type_mappings:
      - type: string
        format: date
        dart_type: DateTime
        import: dart:core
        codec:
          import: package:core/api/adapters/swagger_parser/openapi_date_codec.dart
          from_json: openapiDateFromJson
          to_json: openapiDateToJson
