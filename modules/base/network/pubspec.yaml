name: network
description: Dio client + interceptors for ACITS — configured Dio factory, AuthInterceptor (single-flight token refresh via injected ports), HeaderInterceptor, connectivity/logging seams.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
