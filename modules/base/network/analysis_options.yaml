include: package:flutter_lints/flutter.yaml

# Ширина строки проекта (см. корневой analysis_options.yaml). Пакеты воркспейса
# не наследуют корневой конфиг, поэтому секция дублируется в каждом модуле.
formatter:
  page_width: 120

linter:
  rules:
    unawaited_futures: true
    no_logic_in_create_state: false
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
