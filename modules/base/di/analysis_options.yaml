include: package:flutter_lints/flutter.yaml

# Ширина строки проекта (см. корневой analysis_options.yaml). Пакеты воркспейса
# не наследуют корневой конфиг, поэтому секция дублируется в каждом модуле.
formatter:
  page_width: 120

analyzer:
  exclude:
    # injectable output — генератор кладёт его рядом с @InjectableInit-источником.
    - "lib/src/di_container.config.dart"
