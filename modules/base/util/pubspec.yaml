name: util
description: Pure cross-cutting utilities for ACITS — Result/Failure, AppTask pipeline, DataState, platform-service ports, and small shared helpers (validators, safe-emit, app version, date/URL).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  package_info_plus: ^10.2.2

  # Logger infra (shared Talker factory + formatter/observer, bloc observer).
  talker_flutter: ^5.2.0
  talker_bloc_logger: ^5.2.0
  get_it: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
