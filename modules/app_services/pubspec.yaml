name: app_services
description: App-composition services for ACITS — session/config/animal services, storage + client register modules, port bridges, and document/share platform code. Wired into the app's DI as a micro-package; depends on features + foundation, never on the shell/router tree.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Foundation packages.
  util:
    path: ../base/util
  network:
    path: ../base/network
  core:
    path: ../base/core
  di:
    path: ../base/di
  navigation:
    path: ../base/navigation

  # Feature modules whose data/services these registers + bridges compose.
  animals:
    path: ../animals
  auth:
    path: ../auth
  applicants:
    path: ../applicants
  prescriptions:
    path: ../prescriptions
  personal:
    path: ../personal
  media:
    path: ../media

  # Context-less navigation (logout/deeplink) resolves GoRouter from getIt.
  go_router: ^17.3.0

  # DI.
  injectable: ^3.0.0
  get_it: ^9.2.1

  # HTTP + platform.
  dio: ^5.9.2
  app_links: ^7.0.0
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5
  share_plus: ^12.0.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  web: ^1.1.0

  # Locale for accept-language + collection helpers.
  easy_localization: ^3.0.8
  collection: ^1.19.0
  intl: ^0.20.2

  # Log facade (Talker) — app_services keeps its own copy, matching the
  # per-module convention (each feature module has its own util/log.dart).
  talker_flutter: ^5.1.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^3.0.0
  build_runner: ^2.4.0
