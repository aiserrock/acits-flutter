name: applicants
description: Applicants + curators (staff) feature module — edit screens, their cubits, and the StaffRepository on top of the stable StaffApiPort.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8
  easy_localization: ^3.0.8
  flutter_keyboard_visibility: ^6.0.0
  dio: ^5.11.1
  get_it: ^9.3.0
  talker_flutter: ^5.2.0
  util:
    path: ../base/util
  localization:
    path: ../base/localization
  core:
    path: ../base/core
  ui_kit:
    path: ../ui_kit
  navigation:
    path: ../base/navigation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
