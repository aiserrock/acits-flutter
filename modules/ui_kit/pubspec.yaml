name: ui_kit
description: Design system for ACITS — Material 3 tokens (AppTheme/AppColors), breakpoints, adaptive scaffold, base components, generated assets.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  easy_localization: ^3.0.8
  equatable: ^2.0.8
  shimmer: ^3.0.0
  lottie: ^3.3.3
  dio: ^5.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Пакет ships собственный icomoon для IconRes. Ассетов приложения он не владеет.
flutter:
  fonts:
    - family: icomoon
      fonts:
        - asset: assets/font/icomoon.ttf
