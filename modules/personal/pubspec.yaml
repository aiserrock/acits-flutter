name: personal
description: Personal cabinet + calendar + animal comments feature module — the user profile screen (PersonalService over ProfileApiPort), the change-password dialog, the calendar placeholder, and the animal comments list/edit screens (CommentsService over AnimalNotesApiPort).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  easy_localization: ^3.0.8
  flutter_keyboard_visibility: ^7.0.1
  file_picker: ^13.4.1
  lottie: ^3.3.3
  dio: ^5.9.2
  open_filex: ^5.0.0
  url_launcher: ^6.3.2
  util:
    path: ../base/util
  localization:
    path: ../base/localization
  core:
    path: ../base/core
  ui_kit:
    path: ../ui_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
