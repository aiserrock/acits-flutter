name: personal
description: Personal cabinet + calendar + animal comments feature module — the user profile screen (PersonalService over ProfileApiPort), the change-password dialog, the calendar placeholder, and the animal comments list/edit screens (CommentsService over AnimalNotesApiPort).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8
  easy_localization: ^3.0.8
  flutter_keyboard_visibility: ^6.0.0
  flutter_svg: ^2.2.4
  file_picker: ^13.4.1
  lottie: ^3.7.0
  intl: ^0.20.2
  collection: ^1.19.0
  dio: ^5.11.1
  get_it: ^9.3.0
  talker_flutter: ^5.2.0
  open_filex: ^4.7.0
  url_launcher: ^6.3.3
  util:
    path: ../base/util
  localization:
    path: ../base/localization
  core:
    path: ../base/core
  ui_kit:
    path: ../ui_kit
  navigation:
    path: ../base/navigation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
