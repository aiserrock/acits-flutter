name: auth
description: Auth feature module — login / registration / email confirmation / splash / onboarding / pick-shelter on the new stack. Session state stays in the app behind the AuthSessionApi facade.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8
  formz: ^0.8.1
  collection: ^1.19.0
  dio: ^5.11.1
  easy_localization: ^3.0.8
  flutter_keyboard_visibility: ^6.0.0
  smooth_page_indicator: ^2.0.1
  shimmer: ^3.0.0
  lottie: ^3.8.2
  url_launcher: ^6.3.3
  mask_text_input_formatter: ^2.9.0
  get_it: ^9.3.0
  talker_flutter: ^5.2.0
  util:
    path: ../base/util
  localization:
    path: ../base/localization
  core:
    path: ../base/core
  ui_kit:
    path: ../ui_kit
  navigation:
    path: ../base/navigation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
