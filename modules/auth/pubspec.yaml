name: auth
description: Auth feature module — login / registration / email confirmation / splash / onboarding / pick-shelter on the new stack. Session state stays in the app behind the AuthSessionApi facade.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0
  equatable: ^2.0.8
  formz: ^0.8.0
  collection: ^1.19.0
  dio: ^5.9.2
  easy_localization: ^3.0.8
  flutter_keyboard_visibility: ^6.0.0
  smooth_page_indicator: ^2.0.1
  shimmer: ^3.0.0
  lottie: ^3.3.3
  url_launcher: ^6.3.2
  mask_text_input_formatter: ^2.9.0
  get_it: ^9.2.1
  talker_flutter: ^5.1.16
  acits_core:
    path: ../../packages/acits_core
  l10n:
    path: ../l10n
  acits_domain:
    path: ../../packages/acits_domain
  acits_api:
    path: ../../packages/acits_api
  ui_kit:
    path: ../ui_kit
  navigation:
    path: ../navigation

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
