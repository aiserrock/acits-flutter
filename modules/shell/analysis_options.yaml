include: package:flutter_lints/flutter.yaml

# Ширина строки проекта (см. корневой analysis_options.yaml). Пакеты воркспейса
# не наследуют корневой конфиг, поэтому секция дублируется в каждом модуле.
formatter:
  page_width: 120

analyzer:
  exclude:
    # flutter_gen output (app assets accessor moved here from lib/gen). Generated
    # code — excluded from analysis exactly as the root app excludes lib/gen/**.
    - "lib/gen/**"

linter:
  rules:
    no_logic_in_create_state: false
