name: Regenerate ui_kit goldens (temp)

# One-off helper: golden files were generated on macOS and drift on the
# ubuntu-latest runner CI actually uses (font rendering/antialiasing differ
# across platforms — a known Flutter golden-test limitation, not a bug in the
# widgets). This regenerates them on the same platform CI runs on, so they can
# be committed and CI can compare like-for-like. Deleted once no longer needed.
on:
  workflow_dispatch:
  # workflow_dispatch only fires from the default branch until GitHub has
  # indexed the workflow file there; push on this branch works immediately,
  # which is what actually lets this run without waiting on a merge.
  push:
    branches: [refactor/foundation]
    paths: [".github/workflows/regen-goldens.yml"]

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies (ui_kit)
        working-directory: modules/ui_kit
        run: flutter pub get

      - name: Regenerate goldens
        working-directory: modules/ui_kit
        run: flutter test --update-goldens test/golden_test.dart

      - uses: actions/upload-artifact@v7
        with:
          name: goldens
          path: modules/ui_kit/test/goldens/
          retention-days: 1
