name: Semantic PR

# Enforce that every pull-request title is a semantic-commit line
# (type[(scope)]: subject). The squash-merge commit inherits the PR title, so
# this keeps history and the changelog consistent.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            ci
            refactor
            chore
            test
            build
            perf
            style
            revert
          requireScope: false
