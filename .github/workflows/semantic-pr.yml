name: Semantic PR

# Enforce that every pull-request title is a semantic-commit line
# (type[(scope)]: subject). The squash-merge commit inherits the PR title, so
# this keeps history and the changelog consistent.

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            ci
            refactor
            chore
            test
            build
            perf
            style
            revert
          requireScope: false
