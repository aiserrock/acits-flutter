version: 2

# Weekly dependency updates. The pub workspace is resolved from the root
# pubspec.yaml (all modules/* are workspace members), so one pub block covers
# the app and every module. Minor + patch bumps are grouped into a single PR
# per ecosystem to cut noise; major bumps come as individual PRs so breaking
# changes are reviewed alone.
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: "/android"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types:
          - minor
          - patch
