version: 2

# Weekly pub dependency updates for the root app and the workspace packages.
# Minor + patch bumps are grouped into a single PR per directory to cut noise;
# major bumps come as individual PRs so breaking changes are reviewed alone.
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pub
    directory: "/packages/acits_core"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pub
    directory: "/packages/acits_api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        update-types:
          - minor
          - patch
