# App-level build_runner config. The API client generator (swagger_parser) is
# isolated in packages/acits_api (run via `melos genapi`), NOT in this pass —
# here build_runner only runs injectable / flutter_gen / json_serializable.
targets:
  $default:
    sources:
      include:
        - lib/**
        - test/**
        - pubspec.*
        - $package$
      exclude:
        - test/integration_test/**
