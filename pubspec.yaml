name: acits_flutter
description: Flutter client for https://acits.ru/

publish_to: "none"

version: 0.10.0+24

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: 3.50.0

# Dart pub workspace — root + foundation packages share one resolution.
# Feature modules (modules/*) are added lazily as they are migrated.
workspace:
  - modules/base/localization
  - modules/base/util
  - modules/base/network
  - modules/base/core
  - modules/ui_kit
  - modules/base/navigation
  - modules/base/di
  - modules/base/observability
  - modules/animals
  - modules/auth
  - modules/applicants
  - modules/prescriptions
  - modules/personal
  - modules/media
  - modules/app_services
  - modules/shell

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  cupertino_ui: ^1.1.7
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # Foundation packages (workspace members).
  localization:
    path: modules/base/localization
  util:
    path: modules/base/util
  network:
    path: modules/base/network
  core:
    path: modules/base/core
  ui_kit:
    path: modules/ui_kit

  # DI container: owns the shared get_it instance (GetIt.instance) for the whole
  # app. The @InjectableInit bootstrap itself stays in the app (lib/di) so it can
  # scan lib/service/* app-composition classes — a package can't scan its consumer.
  di:
    path: modules/base/di
  observability:
    path: modules/base/observability

  # Feature module: animals list migrated onto the new stack (Step 8b).
  animals:
    path: modules/animals

  # Feature module: auth (login/registration/splash/onboarding/pick-shelter).
  # Session state stays in the app behind AuthSessionApi (implemented by AuthService).
  auth:
    path: modules/auth

  # App-composition services (session/config/animal, storage + client register
  # modules, port bridges, document/share platform code). Extracted from
  # lib/service so the shell + DI depend on their types without an app edge; its
  # injectables are pulled into DI as a micro-package (externalPackageModules).
  app_services:
    path: modules/app_services

  # App shell: composition screens (root/main/animal detail+edit) + navigation
  # tree (GoRouter factory, extra codec, auth bindings, the six feature router
  # services). The app builds MaterialApp.router with the shell's router and
  # top-level ThemeCubit; the shell's router-service injectables are pulled into
  # DI as a micro-package (externalPackageModules). Owns the app's flutter_gen
  # assets accessor for now (moves to ui_kit in a later step).
  shell:
    path: modules/shell

  cupertino_icons: ^2.0.0
  dio: ^5.9.2
  firebase_core: ^5.2.0
  flutter_bloc: ^9.1.1
  flutter_secure_storage: ^11.2.0
  get_it: ^9.2.1
  go_router: ^18.1.4
  injectable: ^3.0.0
  lottie: ^3.3.3
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  easy_localization: ^3.0.8
  firebase_crashlytics: ^6.1.0
  firebase_analytics: ^13.1.0
  firebase_remote_config: ^7.1.0

  # In-app логи: Talker + экран логов (dev debug-меню) и BLoC-observer.
  # talker_dio_logger НЕ нужен: сетевой лог в dev даёт Alice-интерцептор
  # (экран «HTTP») + LogInterceptor — см. test/dev/service/client/dio_register.dart.
  talker_flutter: ^5.2.0

  # Alice — in-app HTTP-инспектор dev-флейвора: Dio подключается через
  # getDioInterceptor, открывается из debug-меню (showInspector).
  flutter_alice: ^3.0.0

  # Держит нативный splash до конца auth-решения на splash-роуте (preserve/remove),
  # чтобы холодный старт авторизованного юзера не мелькал login. Генерация картинок
  # splash — та же зависимость (flutter_native_splash.yaml), запуск через dart run.
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.13.1
  flutter_lints: ^6.0.0
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.1
  logging: ^1.3.0
  melos: ^8.10.1
  mocktail: ^1.0.5
  patrol: ^4.12.0

flutter:
  uses-material-design: true

  # Дизайн-ассеты (иконки, картинки, шрифт icomoon, lottie, онбординг,
  # галерея) переехали в пакет ui_kit и резолвятся как `packages/ui_kit/...`.
  # Приложение оставляет себе только локализацию и runtime-сертификат.
  assets:
    - assets/translations/
    - assets/cert/

# Patrol integration/e2e tests (industry-standard native UI automation).
# Tests live in integration_test/. Прогон на реальном устройстве/эмуляторе:
#   dart pub global activate patrol_cli 4.4.0   # ← парная к пакету patrol 4.6.1
#   patrol test --target integration_test/auth_login_test.dart --flavor dev \
#     --dart-define=ACITS_TEST_LOGIN=test_user_2 --dart-define=ACITS_TEST_PASSWORD=user10000
# Android-обвязка: android/app/src/androidTest/.../MainActivityTest.java +
# testInstrumentationRunner/testOptions в android/app/build.gradle.
patrol:
  app_name: ACITS
  # Тесты живут в integration_test/ (стандартный каталог Flutter), а не в
  # дефолтном для patrol_cli patrol_test/ — иначе CLI генерирует битые импорты
  # в test_bundle.dart (абсолютные пути) и Gradle-сборка падает.
  test_directory: integration_test
  android:
    package_name: ru.acits.dev
  ios:
    bundle_id: ru.acits.dev

# Melos — task-runner для монорепо. Скрипты живут здесь (melos 8.x читает
# `melos:` из pubspec.yaml; отдельный melos.yaml он не использует). Пакеты
# монорепо melos берёт из dart pub `workspace:` выше — отдельный `packages:`
# не нужен.
#
# Установка: `dart pub global activate melos`. Запуск: `fvm dart run melos run <name>`.
melos:
  sdkPath: .fvm/flutter_sdk

  scripts:
    # ── Codegen ──────────────────────────────────────────────────────────────
    gen:
      description: Кодогенерация (build_runner) — injectable, assets, json. API-клиент — отдельно (melos genapi).
      run: fvm dart run build_runner build --delete-conflicting-outputs

    gen:watch:
      description: build_runner в watch-режиме (регенерация на лету).
      run: fvm dart run build_runner watch --delete-conflicting-outputs

    gen:clean:
      description: Очистить кэш build_runner перед rebuild (после правок swagger-DTO).
      run: fvm dart run build_runner clean

    genapi:
      description: Генерация API-клиента (swagger_parser) в core (api-слой) — изолированно, вне глобального build_runner приложения.
      run: |
        cd modules/base/core
        fvm dart run tool/preprocess_openapi.dart
        fvm dart run swagger_parser
        fvm dart run build_runner build --delete-conflicting-outputs

    genone:
      description: build_runner (freezed/injectable/json) для одного пакета. Использование — MELOS_GENONE_PKG=modules/base/di melos run genone.
      run: |
        cd ${MELOS_GENONE_PKG:-.}
        fvm dart run build_runner build --delete-conflicting-outputs

    l10n:
      description: Сгенерировать общий LocaleKeys (пакет l10n) из assets/translations.
      run: >
        fvm dart run easy_localization:generate
        -S assets/translations -O modules/base/localization/lib/src -o locale_keys.g.dart -f keys

    # ── Качество кода ────────────────────────────────────────────────────────
    analyze:
      description: Статический анализ (flutter analyze).
      run: fvm flutter analyze

    analyze:strict:
      description: Строгий анализ (--fatal-infos --fatal-warnings) + граф пакетов — тот же шаг, что в CI.
      run: tool/ci/gate.sh analyze

    # Формат, анализ и тесты живут в tool/ci/gate.sh: его же вызывает CI, так
    # что локальный гейт и CI проверяют одно и то же.
    format:
      description: Форматирование hand-written кода (line length 120) в корне и модулях, генерённые файлы исключены.
      run: tool/ci/gate.sh format

    format:check:
      description: Проверка форматирования без правок (CI/pre-commit), падает при расхождении.
      run: tool/ci/gate.sh format-check

    # ── Тесты ────────────────────────────────────────────────────────────────
    # Голдены (тег `golden`) сняты на Linux-раннере CI и локально не сходятся по
    # сглаживанию шрифтов, поэтому `test` их исключает; CI гоняет их отдельным шагом.
    test:
      description: Юнит- и виджет-тесты корня и каждого пакета воркспейса с test/ (без голденов).
      run: tool/ci/gate.sh test

    test:goldens:
      description: Только голден-тесты (сходятся на Linux; на macOS — для перезаписи через --update-goldens нельзя).
      run: tool/ci/gate.sh goldens

    test:coverage:
      description: Тесты со сбором покрытия (coverage/lcov.info).
      run: fvm flutter test --coverage

    # ── Сборка ───────────────────────────────────────────────────────────────
    build:apk:
      description: Release APK (Android).
      run: fvm flutter build apk --release

    build:web:
      description: Release-сборка PWA (web).
      run: fvm flutter build web --release

    # ── Обслуживание ─────────────────────────────────────────────────────────
    get:
      description: Разрешить зависимости (flutter pub get).
      run: fvm flutter pub get

    outdated:
      description: Показать устаревшие зависимости.
      run: fvm flutter pub outdated

    # ── Составные ────────────────────────────────────────────────────────────
    ci:
      description: Локальный аналог CI-гейта — формат, анализ, тесты.
      steps:
        - format:check
        - analyze
        - test

    graph:check:
      description: Проверка графа пакетов — нет циклов и зависимостей снизу вверх (см. ARCHITECTURE.md).
      run: fvm dart run tool/check_package_graph.dart

    check-all:
      description: Гейт качества — формат-чек, граф пакетов, строгий анализ (--fatal-infos --fatal-warnings), тесты.
      run: tool/ci/gate.sh all

    fix:
      description: Приборка перед коммитом — кодоген, l10n, формат.
      steps:
        - gen
        - l10n
        - format
