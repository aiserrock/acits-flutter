name: acits_navigation
description: Navigation primitives for ACITS — route path constants, typed param codecs, guards. NO feature/screen imports (breaks the app→nav→screen cycle).
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.44.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
